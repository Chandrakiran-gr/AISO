vertical: local_services
label: Local service business
description: Businesses serving customers through physical locations, appointments, visits, or defined service areas.
example: "Examples: repair service, restaurant, tutoring center, clinic, contractor."
required_fields:
  - nap
  - service_radius
  - service_taxonomy
  - hours
fields:
  - id: category
    label: Business category
    type: text
    required: false
    placeholder: HVAC contractor, tutoring center, repair service, restaurant
    patch_field: category
  - id: nap
    label: Business name, address, and phone number
    type: textarea
    required: true
    placeholder: "Acme Services | 123 Main St, Boston, MA 02118 | (617) 555-0100"
    patch_field: nap
  - id: service_radius
    label: Service radius
    type: text
    required: true
    placeholder: 20 miles around Boston
    patch_field: service_radius
  - id: service_taxonomy
    label: Core services
    type: list
    required: true
    placeholder: Consultation, installation, repair, classes, appointments
    patch_field: service_taxonomy
    validators:
      min_items: 1
  - id: competitors
    label: Local competitors
    type: list
    required: false
    hint: Leave blank to skip competitor comparison questions.
    placeholder: Competitor A, Competitor B, Competitor C
    patch_field: competitors
  - id: license_cert_numbers
    label: License or certification numbers
    type: list
    required: false
    hint: Include these only if they apply to your business.
    placeholder: CSL-123456, EPA-987654
    patch_field: license_cert_numbers
  - id: hours
    label: Working hours
    type: textarea
    required: true
    placeholder: Mon-Fri 8am-6pm, Sat 9am-2pm
    patch_field: hours
  - id: primary_persona
    label: Primary customer
    type: text
    required: false
    placeholder: Homeowners, students, business operators, local families
    patch_field: primary_persona
