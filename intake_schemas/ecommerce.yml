vertical: ecommerce
label: Online store / product brand
description: Product brands selling through their own website, online marketplaces, or retail partners.
required_fields:
  - category
  - price_tier_band
  - target_demographic
  - marketplace_presence
  - shipping_geographic_scope
  - values_positioning
fields:
  - id: category
    label: Product categories
    type: list
    required: true
    placeholder: Clean skincare, mineral sunscreen, travel-size kits
    patch_field: category
    validators:
      min_items: 1
  - id: price_tier_band
    label: Price range
    type: select
    required: true
    patch_field: price_tier_band
    options:
      - Budget
      - Mid-market
      - Premium
      - Luxury
  - id: target_demographic
    label: Target customer group
    type: textarea
    required: true
    placeholder: Women 25-44 with sensitive skin, mostly US urban shoppers
    patch_field: target_demographic
  - id: competitors
    label: Competitors
    type: list
    required: false
    hint: Leave blank to skip competitor comparison questions.
    placeholder: Competitor A, Competitor B, Competitor C
    patch_field: competitors
  - id: marketplace_presence
    label: Where you sell
    type: textarea
    required: true
    hint: "Examples: your website, Amazon, retail partners, or other shopping sites."
    placeholder: Your Shopify site, Amazon, Target.com
    patch_field: marketplace_presence
  - id: shipping_geographic_scope
    label: Shipping locations
    type: text
    required: true
    placeholder: Ships to the United States and Canada
    patch_field: shipping_geographic_scope
  - id: values_positioning
    label: Brand values or positioning
    type: textarea
    required: true
    placeholder: Vegan, cruelty-free, refillable packaging
    patch_field: values_positioning
  - id: primary_persona
    label: Main customer
    type: text
    required: false
    placeholder: Ingredient-conscious skincare shopper
    patch_field: primary_persona
