vertical: ecommerce
label: Ecommerce or online product brand
description: Product brands selling through their own website, online marketplaces, or retail partners.
example: "Examples: DTC brand, Shopify store, Amazon-first product line."
required_fields:
  - category
  - price_tier_band
  - target_demographic
  - marketplace_presence
  - shipping_geographic_scope
  - values_positioning
fields:
  - id: category
    label: Product categories
    type: list
    required: true
    placeholder: Home goods, pantry staples, apparel basics
    patch_field: category
    validators:
      min_items: 1
  - id: price_tier_band
    label: Price range
    type: select
    required: true
    hint: Choose how customers usually perceive your product pricing.
    patch_field: price_tier_band
    options:
      - Budget
      - Mid-market
      - Premium
      - Luxury
  - id: target_demographic
    label: Target customer group
    type: textarea
    required: true
    placeholder: Value-conscious families, hobbyists, business buyers, or regional shoppers
    patch_field: target_demographic
  - id: competitors
    label: Competitors
    type: list
    required: false
    hint: Leave blank to skip competitor comparison questions.
    placeholder: Competitor A, Competitor B, Competitor C
    patch_field: competitors
  - id: marketplace_presence
    label: Where you sell
    type: textarea
    required: true
    hint: "Examples: your website, Amazon, retail partners, or other shopping sites."
    placeholder: Your website, Amazon, wholesale partners, retail marketplaces
    patch_field: marketplace_presence
  - id: shipping_geographic_scope
    label: Shipping locations
    type: text
    required: true
    placeholder: Ships to the United States and Canada
    patch_field: shipping_geographic_scope
  - id: values_positioning
    label: Brand values or positioning
    type: textarea
    required: true
    placeholder: Durable, affordable, premium, sustainable, locally made, expert-tested
    patch_field: values_positioning
  - id: primary_persona
    label: Main customer
    type: text
    required: false
    placeholder: Budget shopper, operations buyer, enthusiast, gift buyer
    patch_field: primary_persona
